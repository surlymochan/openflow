name: Publish to npm

# Publishes @surlymochan/evalid via npm trusted publishing (OIDC).
# No npm token is stored or used: npm exchanges the GitHub Actions OIDC
# token for a short-lived publish grant. The trusted publisher entry on
# npmjs.com must name this exact workflow file (npm-publish.yml).

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: npm-publish
  cancel-in-progress: false

jobs:
  publish:
    # Pinned for the same reason as ci.yml: Playwright 1.65.0 support for
    # the Ubuntu 26.04 image behind ubuntu-latest is unverified.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # For release events, build exactly the tagged tree. Empty on
          # workflow_dispatch, where checkout falls back to the ref the
          # run was dispatched from.
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: npm

      - name: Upgrade npm
        # Trusted publishing requires npm >= 11.5.1; the npm bundled with
        # Node 22 is older, so upgrade explicitly — but pin to the 11 line.
        # npm 12 changed `npm pack --json` output from a top-level array to
        # an object keyed by package name, which the release gate below
        # (test/release-checklist.test.js) consumes; stay on 11 until the
        # gate is verified against the new shape.
        run: npm install -g npm@^11.5.1

      - name: Install
        run: npm ci

      - name: Install Playwright browser
        # npm test (inside the release:pack gate below) needs the browser,
        # same as ci.yml.
        run: npx playwright install --with-deps chromium

      - name: Stage installed xflow skill for the diff gate
        # release:pack includes skill:diff, which compares this checkout's
        # xflow/ skill against the *installed* copy (default
        # ~/.codex/skills/xflow). That installed copy only exists on the
        # maintainer's machine: `npm run skill:sync` creates it through the
        # as-skillhub companion repo (its skills_sync.sh under
        # ~/Documents/workspace/pro/as-skillhub), which a clean runner does
        # not have — sync itself fails there with "missing skills sync
        # script", so the gate cannot be satisfied as-is. Stage the
        # installed copy from this checkout and point the check at it via
        # XFLOW_INSTALLED_SKILL_DIR, the override the check script itself
        # supports. The gate still diffs two separate trees file by file
        # and fails on any mismatch; what CI cannot cover is drift against
        # a maintainer's live installed dir, which stays covered by
        # `npm run release:local` on the maintainer machine (unchanged).
        # The tarball is packed from this same checkout by pack:check, so
        # the staged copy cannot mask a packing regression.
        run: |
          staged="$RUNNER_TEMP/installed-xflow-skill"
          mkdir -p "$staged"
          cp -R xflow/. "$staged"/
          echo "XFLOW_INSTALLED_SKILL_DIR=$staged" >> "$GITHUB_ENV"

      - name: Pre-publish gate
        # The manual publish sequence in docs/npm-publish-handoff.md runs
        # `npm run release:pack` before publishing: verify (npm test),
        # drift scan, skill diff, and `npm pack --dry-run` for the tarball
        # contents check. Keep the same gate here.
        run: npm run release:pack

      - name: Check version
        id: check
        run: |
          pkg_name="$(node -p "require('./package.json').name")"
          pkg_version="$(node -p "require('./package.json').version")"
          echo "version=$pkg_version" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = "release" ]; then
            tag="${{ github.event.release.tag_name }}"
            if [ "${tag#v}" != "$pkg_version" ]; then
              echo "::error::Release tag $tag does not match package.json version $pkg_version; refusing to publish."
              exit 1
            fi
          fi
          if npm view "$pkg_name@$pkg_version" version >/dev/null 2>&1; then
            echo "$pkg_name@$pkg_version is already published on npm; skipping." >> "$GITHUB_STEP_SUMMARY"
            echo "already_published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already_published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        # OIDC trusted publishing: intentionally no NODE_AUTH_TOKEN here.
        # A token in the environment would take precedence over the OIDC
        # exchange and defeat the point of trusted publishing.
        if: steps.check.outputs.already_published != 'true'
        run: npm publish --provenance --access public
